<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Registration — Review queue</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--white:#fff;--orange:#ECAA1D;--navy:#154358;
  --grey-dark:#262626;--grey-mid:#7F7F7F;--grey-light:#D9D9D9;
  --divider:#EBEBEB;--page:#F5F5F5;--danger:#B3261E;--ok:#1E7B4D;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Nunito Sans',Arial,sans-serif;font-weight:300;
  background:var(--page);color:var(--grey-dark);line-height:1.5}
.accent-bar{position:fixed;left:0;top:0;bottom:0;width:6px;background:var(--orange);z-index:20}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
header{background:var(--white);border-bottom:1px solid var(--grey-light);
  padding:16px 40px;margin-left:6px;display:flex;justify-content:space-between;
  align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:900}
h1 span{font-weight:600;color:var(--grey-mid);font-size:13px;margin-left:10px}
main{padding:32px 24px 80px 30px;max-width:1100px;margin:0 auto}
input[type=password],input[type=text]{border:1px solid var(--grey-light);border-radius:8px;
  padding:10px 12px;font:inherit;font-weight:400;min-width:280px}
.btn{border:none;border-radius:8px;padding:10px 16px;font:inherit;font-weight:800;
  font-size:14px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn--dark{background:var(--black);color:var(--white)}
.btn--dark:hover:not(:disabled){background:var(--navy)}
.btn--ok{background:var(--orange);color:var(--black)}
.btn--ok:hover:not(:disabled){background:var(--black);color:var(--white)}
.btn--no{background:var(--white);color:var(--grey-dark);border:1px solid var(--grey-light)}
.btn--no:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
.card{background:var(--white);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  padding:20px 22px;margin-bottom:14px;border-left:4px solid var(--grey-light)}
.card.is-pending{border-left-color:var(--orange)}
.card.is-approved{border-left-color:var(--ok)}
.card.is-rejected{border-left-color:var(--grey-mid)}
.card__top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.card__title{font-size:17px;font-weight:800;color:var(--black)}
.ref{font-size:12px;font-weight:700;color:var(--grey-mid);letter-spacing:.4px}
.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.4px;border-radius:999px;padding:3px 10px;margin-left:8px}
.tag--pending{background:#FDF3DC;color:#8A6100}
.tag--approved{background:#E4F3EA;color:var(--ok)}
.tag--rejected{background:var(--page);color:var(--grey-mid)}
.tag--expired{background:var(--page);color:var(--grey-mid)}
.tag--test{background:var(--page);color:var(--grey-mid);border:1px solid var(--grey-light)}
.tag--dry{background:#000;color:var(--orange)}
.dup{margin-top:12px;background:#FBE9E7;border-radius:8px;padding:10px 12px;
  font-size:13px;font-weight:700;color:var(--danger)}
.err{margin-top:12px;background:#FBE9E7;border-radius:8px;padding:10px 12px;
  font-size:12px;color:var(--danger);overflow-wrap:anywhere}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:14px 0 0;font-size:14px}
dl.kv dt{color:var(--grey-mid);font-weight:600}
dl.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.muted{color:var(--grey-mid);font-size:13px}
details{margin-top:12px}
summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)}
pre{background:var(--page);border-radius:8px;padding:12px;overflow:auto;
  font-size:11.5px;line-height:1.45;max-height:340px}
.banner{background:var(--black);color:var(--white);font-size:12px;font-weight:700;
  text-align:center;padding:8px 16px}
.banner span{color:var(--orange)}
.hidden{display:none !important}
@media (max-width:640px){
  header{padding:14px 20px 14px 26px}
  main{padding:20px 16px 60px 22px}
  dl.kv{grid-template-columns:1fr}
  dl.kv dt{margin-top:8px}
}
</style>
</head>
<body>
<div class="accent-bar" aria-hidden="true"></div>
<div id="dry-banner" class="banner hidden">
  Dry run — <span>nothing is written to Pipedrive</span>. Approvals update the ledger only.
</div>

<header>
  <h1>Deal Registration <span>Review queue</span></h1>
  <div id="who" class="muted"></div>
</header>

<main>
  <form id="gate" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label for="tok" style="font-weight:700;font-size:14px">Admin token</label>
    <input id="tok" type="password" autocomplete="off" placeholder="ADMIN_TOKEN">
    <button class="btn btn--dark" type="submit">Load queue</button>
    <span id="gate-msg" class="muted"></span>
  </form>

  <div id="list" style="margin-top:24px"></div>
</main>

<script>
(() => {
'use strict';

// Pilot-grade admin surface: a local page plus a shared token. When this view
// moves into artome-oy/org-portal it inherits that site's Entra gate and the
// token disappears — the queue rendering is what carries over.
const FN = 'https://zmhlgyszqygmutdeywkm.supabase.co/functions/v1/admin-registrations';

const $ = s => document.querySelector(s);
let token = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtDate = v => {
  if (!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
};

async function call(method, body) {
  const res = await fetch(FN, {
    method,
    headers: { 'content-type': 'application/json', 'x-admin-token': token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok && res.status !== 502) throw new Error(json.message || `HTTP ${res.status}`);
  return json;
}

function render(rows, dryRun) {
  $('#dry-banner').classList.toggle('hidden', !dryRun);
  const pending = rows.filter(r => r.status === 'pending').length;
  $('#who').textContent = `${rows.length} registrations · ${pending} awaiting review`;

  if (!rows.length) {
    $('#list').innerHTML = '<p class="muted">No registrations yet.</p>';
    return;
  }

  $('#list').innerHTML = rows.map(r => {
    const p = r.partners || {};
    const products = (r.products || [])
      .filter(x => Number(x.qty) > 0)
      .map(x => `${esc(x.qty)} × ${esc(x.model)}`).join(', ') || '—';
    const canDecide = r.status === 'pending';
    return `
      <article class="card is-${esc(r.status)}">
        <div class="card__top">
          <div>
            <div class="card__title">${esc(r.customer_name)}, ${esc(r.customer_state)}</div>
            <div class="ref">${esc(r.reference)} · ${esc(p.name || '—')}</div>
          </div>
          <div>
            <span class="tag tag--${esc(r.status)}">${esc(r.status)}</span>
            ${p.is_test ? '<span class="tag tag--test">test</span>' : ''}
            ${r.dry_run ? '<span class="tag tag--dry">dry run</span>' : ''}
          </div>
        </div>

        ${r.duplicate_of ? `<div class="dup">⚠ Possible duplicate claim — another live
          registration exists for this customer. Check before approving.</div>` : ''}
        ${r.sync_error ? `<div class="err"><b>CRM sync error:</b> ${esc(r.sync_error)}</div>` : ''}

        <dl class="kv">
          <dt>Submitted by</dt><dd>${esc(r.contact_name)} · ${esc(r.submitted_by_email)}</dd>
          <dt>Customer contact</dt><dd>${esc(r.customer_contact_name)} · ${esc(r.customer_contact_email)}</dd>
          <dt>Products</dt><dd>${products}</dd>
          <dt>Demo</dt><dd>${esc(r.demo_status)}</dd>
          <dt>Expected close</dt><dd>${fmtDate(r.expected_close_date)}</dd>
          <dt>Terms</dt><dd>−${esc(r.discount_pct)}% · ${esc(r.protection_days)} days</dd>
          <dt>Submitted</dt><dd>${fmtDate(r.created_at)}</dd>
          ${r.expires_at ? `<dt>Protection expires</dt><dd>${fmtDate(r.expires_at)}</dd>` : ''}
          <dt>Pipedrive lead</dt><dd>${r.pipedrive_lead_id ? esc(r.pipedrive_lead_id) : '—'}</dd>
        </dl>

        ${r.payload_preview ? `<details><summary>Payload that would be / was sent to Pipedrive</summary>
          <pre>${esc(JSON.stringify(r.payload_preview, null, 2))}</pre></details>` : ''}

        ${canDecide ? `<div class="actions">
          <button class="btn btn--ok" data-approve="${esc(r.id)}">Approve</button>
          <button class="btn btn--no" data-reject="${esc(r.id)}">Reject</button>
        </div>` : ''}
      </article>`;
  }).join('');
}

async function load() {
  const { registrations, dryRun } = await call('GET');
  render(registrations || [], dryRun);
}

$('#gate').addEventListener('submit', async e => {
  e.preventDefault();
  token = $('#tok').value.trim();
  $('#gate-msg').textContent = 'Loading…';
  try {
    await load();
    $('#gate-msg').textContent = '';
  } catch (ex) {
    $('#gate-msg').textContent = ex.message;
  }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-approve],[data-reject]');
  if (!t) return;
  const id = t.dataset.approve || t.dataset.reject;
  const action = t.dataset.approve ? 'approve' : 'reject';
  t.disabled = true;
  t.textContent = action === 'approve' ? 'Approving…' : 'Rejecting…';
  try {
    const res = await call('POST', { id, action });
    if (res.syncError) alert('Recorded, but the Pipedrive sync failed:\n\n' + res.syncError);
    await load();
  } catch (ex) {
    alert(ex.message);
    t.disabled = false;
    t.textContent = action === 'approve' ? 'Approve' : 'Reject';
  }
});
})();
</script>
</body>
</html>
